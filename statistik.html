<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik – Wesermarschpokal</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --warning-bg: #fef9c3;
            --warning-text: #854d0e;
            --warning-border: #fde047;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            position: relative;
        }

        /* Burger Menu Navigation */
        .burger-menu-container {
            position: absolute;
            top: 45px;
            left: 20px;
            z-index: 100;
        }

        .burger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 22px;
        }

        .burger-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--primary);
            border-radius: 2px;
        }

        .drawer-menu {
            display: none;
            position: absolute;
            top: 35px;
            left: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 240px;
            padding: 10px 0;
            z-index: 101;
        }

        .drawer-menu.active { display: block; }

        .drawer-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            background: none;
            border: none;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            box-sizing: border-box;
        }

        .drawer-btn:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .header-print {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .header-title h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header-title p {
            margin: 2px 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
        }

        .btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-outline {
            background-color: #ffffff;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background-color: #f0f9ff;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
        }

        @media (min-width: 700px) {
            .filter-grid {
                grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            }
        }

        .filter-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .filter-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background: #ffffff;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .status-box {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .status-box.info {
            display: block;
            background: #e0f2fe;
            color: #075985;
            border: 1px solid #7dd3fc;
        }

        .status-box.warning {
            display: block;
            background: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        .status-box.error {
            display: block;
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fca5a5;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 10px 0;
        }

        .section-title-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .section-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
            color: var(--text-main);
        }

        th.num, td.num {
            text-align: center;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .player-link-btn {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font: inherit;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .player-link-btn:hover {
            color: var(--primary-hover);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #334155;
        }

        .result-win {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .result-loss {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="burger-menu-container">
        <button type="button" class="burger-btn" id="burgerBtn" title="Menü öffnen">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="drawer-menu" id="drawerMenu">
            <a href="index.html" class="drawer-btn">📝 Spielbericht</a>
            <a href="uebersicht_spiele.html" class="drawer-btn">📋 Übersicht Spiele</a>
            <a href="statistik.html" class="drawer-btn">📊 Statistik</a>
        </div>
    </div>

    <div class="header-print">
        <div class="header-title">
            <h1>Tischtennis Kreisverband Wesermarsch e.V.</h1>
            <p>Auswertung aller gespielten Partien</p>
        </div>
    </div>

    <div class="actions-bar">
        <button type="button" class="btn btn-secondary btn-sm" id="btnRefresh">🔄 Aktualisieren</button>
    </div>

    <div class="filter-grid">
        <div class="filter-group">
            <label for="playerFilter">Spieler</label>
            <select id="playerFilter">
                <option value="">Alle Spieler (Bilanzübersicht)</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="saisonFilter">Spielzeit</label>
            <select id="saisonFilter"></select>
        </div>
        <div class="filter-group">
            <label for="vereinFilter">Verein</label>
            <select id="vereinFilter">
                <option value="">Alle Vereine</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="klasseFilter">Spielklasse</label>
            <select id="klasseFilter">
                <option value="">Alle Spielklassen</option>
                <option value="Erwachsene">Erwachsene</option>
                <option value="Jugend 19">Jugend 19</option>
                <option value="Jugend 15">Jugend 15</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="modeFilter">Einzel / Doppel</label>
            <select id="modeFilter">
                <option value="einzel">Einzel</option>
                <option value="doppel">Doppel</option>
            </select>
        </div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div class="section-title">
        <div class="section-title-left">
            <h2 id="tableHeading">Spielerbilanz</h2>
            <button type="button" class="btn btn-outline btn-sm" id="btnBackToOverview" style="display: none;">← Zurück zur Bilanz</button>
        </div>
        <span class="section-sub" id="tableSubheading"></span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead id="statsTableHead"></thead>
            <tbody id="statsTableBody">
                <tr>
                    <td colspan="3" class="empty-state">Lade Spielberichte aus dem Archiv...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const GITHUB_USER = 'Wesermarschpokal';
    const GITHUB_REPO = 'Wesermarschpokal';
    const ARCHIV_PATH = 'archiv';

    let allGames = [];
    let nameAliasMap = new Map();

    function setStatus(type, message) {
        const box = document.getElementById('statusBox');
        if (!message) {
            box.className = 'status-box';
            box.textContent = '';
            return;
        }
        box.className = `status-box ${type}`;
        box.textContent = message;
    }

    function updateBackButtonVisibility(hasSelectedPlayer) {
        const btn = document.getElementById('btnBackToOverview');
        if (!btn) return;
        btn.style.display = hasSelectedPlayer ? 'inline-flex' : 'none';
    }

    /**
     * Extrahiert den reinen Vereinsnamen ohne Mannschaftskennung
     * (z. B. "Oldenbroker TV 1-6" -> "Oldenbroker TV").
     */
    function extractClubName(teamName) {
        let name = String(teamName || '').trim().replace(/\s+/g, ' ');
        if (!name) return '';

        let prev = '';
        while (name && name !== prev) {
            prev = name;
            name = name
                .replace(/\s+\d+\s*[-–/]\s*\d+$/i, '')
                .replace(/\s+(?:U\d+|J\d+|mU\d+|wU\d+|mJ\d+|wJ\d+)$/i, '')
                .replace(/\s+(?:I{1,4}|IV|V|VI{0,3})$/i, '')
                .replace(/\s+\d+$/i, '')
                .trim();
        }

        return name || String(teamName || '').trim().replace(/\s+/g, ' ');
    }

    function getSeasonFromDateStr(dateStr) {
        const raw = (dateStr || '').trim();
        let year = null;
        let month = null;

        const isoMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (isoMatch) {
            year = parseInt(isoMatch[1], 10);
            month = parseInt(isoMatch[2], 10);
        } else {
            const deMatch = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (deMatch) {
                month = parseInt(deMatch[2], 10);
                year = parseInt(deMatch[3], 10);
            }
        }

        if (!year || !month || month < 1 || month > 12) {
            return '';
        }

        const startYear = month >= 9 ? year : year - 1;
        return `${startYear}/${startYear + 1}`;
    }

    function getSeasonStartYear(seasonStr) {
        const match = String(seasonStr || '').match(/^(\d{4})\/\d{4}$/);
        return match ? parseInt(match[1], 10) : -1;
    }

    function populateSeasonDropdown() {
        const select = document.getElementById('saisonFilter');
        if (!select) return;
        const prevVal = select.value;

        const seasonSet = new Set();
        allGames.forEach(g => {
            const season = getSeasonFromDateStr(g?.datum);
            if (season) seasonSet.add(season);
        });

        const sortedSeasons = [...seasonSet].sort((a, b) => getSeasonStartYear(b) - getSeasonStartYear(a));

        select.innerHTML = '';
        if (sortedSeasons.length === 0) {
            select.add(new Option('Keine Spielzeit vorhanden', ''));
            select.value = '';
            return;
        }

        sortedSeasons.forEach(season => {
            select.add(new Option(season, season));
        });

        if (prevVal && sortedSeasons.includes(prevVal)) {
            select.value = prevVal;
        } else {
            select.value = sortedSeasons[0];
        }
    }

    function populateClubDropdown() {
        const select = document.getElementById('vereinFilter');
        if (!select) return;
        const prevVal = select.value;
        const selectedSeason = document.getElementById('saisonFilter').value;
        const selectedKlasse = document.getElementById('klasseFilter').value;

        const clubMap = new Map();
        allGames.forEach(g => {
            const gameSeason = getSeasonFromDateStr(g?.datum);
            if (selectedSeason && gameSeason !== selectedSeason) return;
            if (selectedKlasse && (g.spielklasse || '') !== selectedKlasse) return;

            [g.heimName, g.gastName].forEach(name => {
                const club = extractClubName(name);
                const key = club.toLowerCase();
                if (club && !clubMap.has(key)) {
                    clubMap.set(key, club);
                }
            });
        });

        const sortedClubs = [...clubMap.values()].sort((a, b) => a.localeCompare(b, 'de'));

        select.innerHTML = '<option value="">Alle Vereine</option>';
        sortedClubs.forEach(club => {
            select.add(new Option(club, club.toLowerCase()));
        });

        if (prevVal && [...select.options].some(o => o.value === prevVal)) {
            select.value = prevVal;
        } else {
            select.value = '';
        }
    }

    function decodeBase64Utf8(base64Str) {
        const clean = (base64Str || '').replace(/\n/g, '');
        const binaryStr = atob(clean);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    }

    function formatGermanDate(dateStr) {
        const match = (dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return dateStr || '–';
        return `${match[3]}.${match[2]}.${match[1]}`;
    }

    function getMatchDateSortValue(game) {
        const rawDate = (game && game.datum ? String(game.datum) : '').trim();
        const dateMatch = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!dateMatch) return null;

        const year = parseInt(dateMatch[1], 10);
        const month = parseInt(dateMatch[2], 10) - 1;
        const day = parseInt(dateMatch[3], 10);

        let hours = 0;
        let minutes = 0;
        const rawTime = (game && game.uhrzeit ? String(game.uhrzeit) : '').trim();
        const timeMatch = rawTime.match(/^(\d{1,2}):(\d{2})$/);
        if (timeMatch) {
            hours = parseInt(timeMatch[1], 10) || 0;
            minutes = parseInt(timeMatch[2], 10) || 0;
        }

        const dt = new Date(year, month, day, hours, minutes, 0, 0);
        return isNaN(dt.getTime()) ? null : dt.getTime();
    }

    function cleanRawName(name) {
        return String(name || '').trim().replace(/\s+/g, ' ');
    }

    function getCanonicalPersonKey(name) {
        const clean = cleanRawName(name);
        if (!clean) return '';

        if (clean.includes(',')) {
            const parts = clean.split(',').map(p => p.trim().toLowerCase()).filter(Boolean);
            if (parts.length >= 2) {
                const last = parts[0];
                const first = parts.slice(1).join(' ');
                return `${last}, ${first}`;
            }
        }

        const tokens = clean.toLowerCase().split(' ').filter(Boolean);
        if (tokens.length === 2) {
            return `${tokens[1]}, ${tokens[0]}`;
        }

        return clean.toLowerCase();
    }

    function formatCanonicalDisplay(canonicalKey) {
        if (!canonicalKey) return '';
        return canonicalKey
            .split(' ')
            .map(word => word.split('-').map(part => part ? part[0].toUpperCase() + part.slice(1) : '').join('-'))
            .join(' ');
    }

    function rebuildNameAliasMap(games) {
        const canonicalToVariants = new Map();

        games.forEach(game => {
            if (!Array.isArray(game.matches)) return;
            game.matches.forEach(m => {
                if (!isPlayedMatch(m)) return;
                [m.playerA, m.playerB].forEach(sideStr => {
                    cleanRawName(sideStr).split('/').forEach(part => {
                        const clean = cleanRawName(part);
                        const canon = getCanonicalPersonKey(clean);
                        if (!canon) return;
                        if (!canonicalToVariants.has(canon)) {
                            canonicalToVariants.set(canon, new Map());
                        }
                        const variants = canonicalToVariants.get(canon);
                        variants.set(clean, (variants.get(clean) || 0) + 1);
                    });
                });
            });
        });

        const aliasMap = new Map();
        canonicalToVariants.forEach((variants, canon) => {
            const sortedVariants = [...variants.entries()].sort((a, b) => {
                const aComma = a[0].includes(',') ? 1 : 0;
                const bComma = b[0].includes(',') ? 1 : 0;
                if (bComma !== aComma) return bComma - aComma;
                if (b[1] !== a[1]) return b[1] - a[1];
                return a[0].localeCompare(b[0], 'de');
            });
            const preferredLabel = sortedVariants[0]?.[0] || formatCanonicalDisplay(canon);
            aliasMap.set(canon, preferredLabel);
        });

        nameAliasMap = aliasMap;
    }

    function normalizeName(name) {
        const clean = cleanRawName(name);
        if (!clean) return '';
        const canon = getCanonicalPersonKey(clean);
        return nameAliasMap.get(canon) || clean;
    }

    function normalizeKey(name) {
        return getCanonicalPersonKey(name);
    }

    function isDoubleMatch(match) {
        return match && (match.type === 'doppel' || match.type === 'frei');
    }

    function isSingleMatch(match) {
        return match && match.type === 'einzel';
    }

    function getMatchSets(match) {
        const saetzeA = parseInt(match?.saetzeA, 10) || 0;
        const saetzeB = parseInt(match?.saetzeB, 10) || 0;
        return { saetzeA, saetzeB };
    }

    function isPlayedMatch(match) {
        if (!match) return false;
        const { saetzeA, saetzeB } = getMatchSets(match);
        const isCompleted = Boolean(match.finished) || saetzeA === 3 || saetzeB === 3;
        return isCompleted && saetzeA !== saetzeB;
    }

    function parseSetPoints(setStr) {
        if (!setStr || typeof setStr !== 'string') return null;
        const parts = setStr.trim().split(':');
        if (parts.length !== 2) return null;
        const a = parseInt(parts[0].trim(), 10);
        const b = parseInt(parts[1].trim(), 10);
        if (isNaN(a) || isNaN(b)) return null;
        return { a, b };
    }

    function getMatchBallTotals(match) {
        let ballsA = 0;
        let ballsB = 0;
        if (Array.isArray(match.sets)) {
            match.sets.forEach(s => {
                const parsed = parseSetPoints(s);
                if (parsed) {
                    ballsA += parsed.a;
                    ballsB += parsed.b;
                }
            });
        }
        return { ballsA, ballsB };
    }

    function getNormalizedDoubleLabel(pairText) {
        const raw = cleanRawName(pairText);
        const parts = raw.split('/').map(p => normalizeName(p)).filter(Boolean);
        if (parts.length < 2) return normalizeName(raw);
        const sorted = [...parts].sort((a, b) => a.localeCompare(b, 'de'));
        return sorted.join(' / ');
    }

    function getNormalizedDoubleKey(pairText) {
        const raw = cleanRawName(pairText);
        const parts = raw.split('/').map(p => normalizeKey(p)).filter(Boolean);
        if (parts.length < 2) return normalizeKey(raw);
        return [...parts].sort().join(' / ');
    }

    function pairContainsPlayer(pairText, playerKey) {
        const parts = cleanRawName(pairText).split('/').map(p => normalizeKey(p)).filter(Boolean);
        return parts.includes(playerKey);
    }

    function matchesFilters(game, selectedSeason, selectedClub, selectedKlasse) {
        const gameSeason = getSeasonFromDateStr(game?.datum);
        if (selectedSeason && gameSeason !== selectedSeason) return false;
        if (selectedKlasse && (game.spielklasse || '') !== selectedKlasse) return false;
        if (selectedClub) {
            const heimClubKey = extractClubName(game.heimName).toLowerCase();
            const gastClubKey = extractClubName(game.gastName).toLowerCase();
            if (heimClubKey !== selectedClub && gastClubKey !== selectedClub) return false;
        }
        return true;
    }

    function sideMatchesSelectedClub(game, side, selectedClub) {
        if (!selectedClub) return true;
        const teamName = side === 'A' ? game.heimName : game.gastName;
        return extractClubName(teamName).toLowerCase() === selectedClub;
    }

    function collectAllPlayers(games, selectedSeason, selectedClub, selectedKlasse) {
        const map = new Map();

        games.forEach(game => {
            if (!matchesFilters(game, selectedSeason, selectedClub, selectedKlasse)) return;

            if (Array.isArray(game.matches)) {
                game.matches.forEach(m => {
                    if (!isPlayedMatch(m)) return;
                    ['A', 'B'].forEach(side => {
                        if (!sideMatchesSelectedClub(game, side, selectedClub)) return;
                        const sideStr = side === 'A' ? m.playerA : m.playerB;
                        cleanRawName(sideStr).split('/').forEach(part => {
                            const clean = normalizeName(part);
                            const key = normalizeKey(clean);
                            if (key && !map.has(key)) {
                                map.set(key, clean);
                            }
                        });
                    });
                });
            }
        });

        return [...map.entries()]
            .map(([key, label]) => ({ key, label }))
            .sort((a, b) => a.label.localeCompare(b.label, 'de'));
    }

    function populatePlayerDropdown() {
        const select = document.getElementById('playerFilter');
        const selectedSeason = document.getElementById('saisonFilter').value;
        const selectedClub = document.getElementById('vereinFilter').value;
        const selectedKlasse = document.getElementById('klasseFilter').value;
        const prevVal = select.value;

        const players = collectAllPlayers(allGames, selectedSeason, selectedClub, selectedKlasse);
        select.innerHTML = '<option value="">Alle Spieler (Bilanzübersicht)</option>';

        players.forEach(p => {
            const opt = new Option(p.label, p.key);
            select.add(opt);
        });

        if (prevVal && [...select.options].some(o => o.value === prevVal)) {
            select.value = prevVal;
        } else {
            select.value = '';
        }
    }

    async function loadGamesFromGitHub() {
        setStatus('info', 'Spielberichte werden aus dem Archiv geladen...');
        const tbody = document.getElementById('statsTableBody');
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Lade Daten...</td></tr>';

        try {
            const dirUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARCHIV_PATH}`;
            const dirRes = await fetch(dirUrl);

            if (dirRes.status === 404) {
                allGames = [];
                nameAliasMap = new Map();
                setStatus('', '');
                populateSeasonDropdown();
                populateClubDropdown();
                populatePlayerDropdown();
                renderStats();
                return;
            }

            if (!dirRes.ok) {
                throw new Error(`GitHub-API Fehler (${dirRes.status})`);
            }

            const files = await dirRes.json();
            const jsonFiles = Array.isArray(files)
                ? files.filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.json'))
                : [];

            let failedFilesCount = 0;

            const loaded = await Promise.all(jsonFiles.map(async (file) => {
                try {
                    const fileRes = await fetch(file.url);
                    if (!fileRes.ok) {
                        failedFilesCount++;
                        return null;
                    }
                    const fileJson = await fileRes.json();
                    const rawContent = fileJson.content
                        ? decodeBase64Utf8(fileJson.content)
                        : await (await fetch(file.download_url)).text();
                    const parsed = JSON.parse(rawContent);
                    if (!parsed || typeof parsed !== 'object') {
                        failedFilesCount++;
                        return null;
                    }
                    return {
                        ...parsed,
                        _fileName: file.name
                    };
                } catch (err) {
                    failedFilesCount++;
                    console.warn('Fehler beim Lesen einer Spieldatei:', file.name, err);
                    return null;
                }
            }));

            allGames = loaded
                .filter(Boolean)
                .sort((a, b) => {
                    const tA = getMatchDateSortValue(a);
                    const tB = getMatchDateSortValue(b);
                    if (tA !== null && tB !== null && tA !== tB) return tB - tA;
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });

            rebuildNameAliasMap(allGames);

            if (failedFilesCount > 0) {
                setStatus(
                    'warning',
                    `Hinweis: ${failedFilesCount} Spielbericht${failedFilesCount === 1 ? '' : 'e'} im Archiv konnte${failedFilesCount === 1 ? '' : 'n'} nicht fehlerfrei geladen werden.`
                );
            } else {
                setStatus('', '');
            }

            populateSeasonDropdown();
            populateClubDropdown();
            populatePlayerDropdown();
            renderStats();
        } catch (err) {
            console.error(err);
            setStatus('error', `Fehler beim Laden der Spielberichte: ${err.message}`);
            tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Keine Daten verfügbar.</td></tr>';
        }
    }

    function buildFilterSummary(selectedSeason, selectedClub, selectedKlasse, mode) {
        const clubSelect = document.getElementById('vereinFilter');
        const clubLabel = selectedClub
            ? (clubSelect.options[clubSelect.selectedIndex]?.textContent || selectedClub)
            : '';

        const parts = [];
        parts.push(selectedSeason ? `Spielzeit: ${selectedSeason}` : 'Keine Spielzeit gewählt');
        if (clubLabel) parts.push(`Verein: ${clubLabel}`);
        if (selectedKlasse) parts.push(`Spielklasse: ${selectedKlasse}`);
        parts.push(mode === 'doppel' ? 'Doppel' : 'Einzel');
        parts.push('Nur gespielte Partien');
        return parts.join(' · ');
    }

    function selectPlayerFromOverview(playerKey) {
        const playerSelect = document.getElementById('playerFilter');
        if (!playerSelect || !playerKey) return;
        if ([...playerSelect.options].some(o => o.value === playerKey)) {
            playerSelect.value = playerKey;
            renderStats();
        }
    }

    function resetPlayerFilterToOverview() {
        const playerSelect = document.getElementById('playerFilter');
        if (!playerSelect) return;
        playerSelect.value = '';
        renderStats();
    }

    function renderOverviewTable(selectedSeason, selectedClub, selectedKlasse, mode) {
        updateBackButtonVisibility(false);

        const thead = document.getElementById('statsTableHead');
        const tbody = document.getElementById('statsTableBody');
        const heading = document.getElementById('tableHeading');
        const subheading = document.getElementById('tableSubheading');

        const isDouble = mode === 'doppel';
        heading.textContent = isDouble ? 'Doppelpaarungen – Bilanz' : 'Spieler – Bilanz';
        subheading.textContent = buildFilterSummary(selectedSeason, selectedClub, selectedKlasse, mode);

        thead.innerHTML = `
            <tr>
                <th>${isDouble ? 'Doppelpaarung' : 'Name'}</th>
                <th class="num">Spiele</th>
                <th class="num">Sätze</th>
            </tr>
        `;

        const statsMap = new Map();

        function ensureEntry(key, label) {
            if (!statsMap.has(key)) {
                statsMap.set(key, {
                    key,
                    label,
                    wins: 0,
                    losses: 0,
                    setsWon: 0,
                    setsLost: 0
                });
            }
            return statsMap.get(key);
        }

        allGames.forEach(game => {
            if (!matchesFilters(game, selectedSeason, selectedClub, selectedKlasse)) return;
            if (!Array.isArray(game.matches)) return;

            game.matches.forEach(m => {
                if (!isPlayedMatch(m)) return;
                if (isDouble && !isDoubleMatch(m)) return;
                if (!isDouble && !isSingleMatch(m)) return;

                const { saetzeA, saetzeB } = getMatchSets(m);
                const labelA = isDouble ? getNormalizedDoubleLabel(m.playerA) : normalizeName(m.playerA);
                const labelB = isDouble ? getNormalizedDoubleLabel(m.playerB) : normalizeName(m.playerB);

                if (labelA && sideMatchesSelectedClub(game, 'A', selectedClub)) {
                    const keyA = isDouble ? getNormalizedDoubleKey(m.playerA) : normalizeKey(m.playerA);
                    const entryA = ensureEntry(keyA, labelA);
                    entryA.setsWon += saetzeA;
                    entryA.setsLost += saetzeB;
                    if (saetzeA > saetzeB) entryA.wins += 1;
                    else if (saetzeB > saetzeA) entryA.losses += 1;
                }

                if (labelB && sideMatchesSelectedClub(game, 'B', selectedClub)) {
                    const keyB = isDouble ? getNormalizedDoubleKey(m.playerB) : normalizeKey(m.playerB);
                    const entryB = ensureEntry(keyB, labelB);
                    entryB.setsWon += saetzeB;
                    entryB.setsLost += saetzeA;
                    if (saetzeB > saetzeA) entryB.wins += 1;
                    else if (saetzeA > saetzeB) entryB.losses += 1;
                }
            });
        });

        const rows = [...statsMap.values()].sort((a, b) => {
            if (b.wins !== a.wins) return b.wins - a.wins;
            const diffA = a.setsWon - a.setsLost;
            const diffB = b.setsWon - b.setsLost;
            if (diffB !== diffA) return diffB - diffA;
            return a.label.localeCompare(b.label, 'de');
        });

        if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Keine gespielten Partien für diese Auswahl gefunden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        rows.forEach(r => {
            const tr = document.createElement('tr');

            const tdName = document.createElement('td');
            if (!isDouble) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'player-link-btn';
                btn.textContent = r.label;
                btn.title = `Einzelpartien von ${r.label} anzeigen`;
                btn.addEventListener('click', () => selectPlayerFromOverview(r.key));
                tdName.appendChild(btn);
            } else {
                tdName.textContent = r.label;
                tdName.style.fontWeight = '600';
            }

            const tdGames = document.createElement('td');
            tdGames.className = 'num';
            tdGames.textContent = `${r.wins}:${r.losses}`;
            tdGames.style.fontWeight = '700';

            const tdSets = document.createElement('td');
            tdSets.className = 'num';
            tdSets.textContent = `${r.setsWon}:${r.setsLost}`;
            tdSets.style.fontWeight = '600';

            tr.append(tdName, tdGames, tdSets);
            tbody.appendChild(tr);
        });
    }

    function renderPlayerMatchesTable(playerKey, selectedSeason, selectedClub, selectedKlasse, mode) {
        updateBackButtonVisibility(true);

        const thead = document.getElementById('statsTableHead');
        const tbody = document.getElementById('statsTableBody');
        const heading = document.getElementById('tableHeading');
        const subheading = document.getElementById('tableSubheading');

        const playerSelect = document.getElementById('playerFilter');
        const playerLabel = playerSelect.options[playerSelect.selectedIndex]?.textContent || formatCanonicalDisplay(playerKey);
        const isDouble = mode === 'doppel';

        heading.textContent = `Gespielte Partien von ${playerLabel}`;
        subheading.textContent = buildFilterSummary(selectedSeason, selectedClub, selectedKlasse, mode);

        thead.innerHTML = `
            <tr>
                <th>Datum</th>
                <th>Spielklasse</th>
                <th>Art</th>
                <th>Paarung / Gegner</th>
                <th class="num">Ergebnis</th>
                <th class="num">Satzverhältnis</th>
                <th class="num">Punktverhältnis</th>
            </tr>
        `;

        const playerMatches = [];

        allGames.forEach(game => {
            if (!matchesFilters(game, selectedSeason, selectedClub, selectedKlasse)) return;
            if (!Array.isArray(game.matches)) return;

            game.matches.forEach(m => {
                if (!isPlayedMatch(m)) return;
                if (isDouble && !isDoubleMatch(m)) return;
                if (!isDouble && !isSingleMatch(m)) return;

                const inA = (isDouble
                    ? pairContainsPlayer(m.playerA, playerKey)
                    : normalizeKey(m.playerA) === playerKey) && sideMatchesSelectedClub(game, 'A', selectedClub);
                const inB = (isDouble
                    ? pairContainsPlayer(m.playerB, playerKey)
                    : normalizeKey(m.playerB) === playerKey) && sideMatchesSelectedClub(game, 'B', selectedClub);

                if (!inA && !inB) return;

                const { saetzeA, saetzeB } = getMatchSets(m);
                const ownSets = inA ? saetzeA : saetzeB;
                const oppSets = inA ? saetzeB : saetzeA;

                const { ballsA, ballsB } = getMatchBallTotals(m);
                const ownBalls = inA ? ballsA : ballsB;
                const oppBalls = inA ? ballsB : ballsA;

                const outcome = ownSets > oppSets ? 'Sieg' : 'Niederlage';

                const pairingText = isDouble
                    ? `${getNormalizedDoubleLabel(m.playerA)}  vs.  ${getNormalizedDoubleLabel(m.playerB)}`
                    : `${normalizeName(m.playerA)}  vs.  ${normalizeName(m.playerB)}`;

                playerMatches.push({
                    datum: game.datum || '',
                    spielklasse: game.spielklasse || '–',
                    art: isDouble ? 'Doppel' : 'Einzel',
                    pairing: pairingText,
                    outcome,
                    satzVerhaeltnis: `${ownSets}:${oppSets}`,
                    punktVerhaeltnis: `${ownBalls}:${oppBalls}`
                });
            });
        });

        if (playerMatches.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Für diesen Spieler wurden in der gewählten Ansicht keine gespielten Partien gefunden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        playerMatches.forEach(item => {
            const tr = document.createElement('tr');

            const tdDate = document.createElement('td');
            tdDate.textContent = formatGermanDate(item.datum);

            const tdKlasse = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = item.spielklasse;
            tdKlasse.appendChild(badge);

            const tdArt = document.createElement('td');
            tdArt.textContent = item.art;

            const tdPairing = document.createElement('td');
            tdPairing.textContent = item.pairing;
            tdPairing.style.fontWeight = '500';

            const tdOutcome = document.createElement('td');
            tdOutcome.className = 'num';
            if (item.outcome === 'Sieg') {
                tdOutcome.innerHTML = '<span class="result-win">Sieg</span>';
            } else {
                tdOutcome.innerHTML = '<span class="result-loss">Niederlage</span>';
            }

            const tdSaetze = document.createElement('td');
            tdSaetze.className = 'num';
            tdSaetze.textContent = item.satzVerhaeltnis;
            tdSaetze.style.fontWeight = '700';

            const tdPunkte = document.createElement('td');
            tdPunkte.className = 'num';
            tdPunkte.textContent = item.punktVerhaeltnis;
            tdPunkte.style.fontWeight = '600';

            tr.append(tdDate, tdKlasse, tdArt, tdPairing, tdOutcome, tdSaetze, tdPunkte);
            tbody.appendChild(tr);
        });
    }

    function renderStats() {
        const playerKey = document.getElementById('playerFilter').value;
        const selectedSeason = document.getElementById('saisonFilter').value;
        const selectedClub = document.getElementById('vereinFilter').value;
        const selectedKlasse = document.getElementById('klasseFilter').value;
        const mode = document.getElementById('modeFilter').value;

        if (playerKey) {
            renderPlayerMatchesTable(playerKey, selectedSeason, selectedClub, selectedKlasse, mode);
        } else {
            renderOverviewTable(selectedSeason, selectedClub, selectedKlasse, mode);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const burgerBtn = document.getElementById('burgerBtn');
        const drawerMenu = document.getElementById('drawerMenu');
        if (burgerBtn && drawerMenu) {
            burgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                drawerMenu.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!drawerMenu.contains(e.target) && !burgerBtn.contains(e.target)) {
                    drawerMenu.classList.remove('active');
                }
            });
        }

        document.getElementById('btnRefresh').addEventListener('click', loadGamesFromGitHub);
        document.getElementById('btnBackToOverview').addEventListener('click', resetPlayerFilterToOverview);
        document.getElementById('saisonFilter').addEventListener('change', () => {
            populateClubDropdown();
            populatePlayerDropdown();
            renderStats();
        });
        document.getElementById('vereinFilter').addEventListener('change', () => {
            populatePlayerDropdown();
            renderStats();
        });
        document.getElementById('klasseFilter').addEventListener('change', () => {
            populateClubDropdown();
            populatePlayerDropdown();
            renderStats();
        });
        document.getElementById('playerFilter').addEventListener('change', renderStats);
        document.getElementById('modeFilter').addEventListener('change', renderStats);

        loadGamesFromGitHub();
    });
</script>
