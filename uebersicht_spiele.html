<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielberichte – Wesermarschpokal</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            margin-bottom: 18px;
            border-bottom: 2px solid var(--primary);
        }

        .header h1 {
            margin: 0;
            font-size: 1.35rem;
            color: var(--primary);
        }

        .header p {
            margin: 3px 0 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-muted {
            background: #64748b;
        }

        .btn-muted:hover {
            background: #475569;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            margin-bottom: 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .filters input,
        .filters select {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            font-size: 0.88rem;
            color: var(--text);
        }

        .filters input {
            flex: 1;
            min-width: 220px;
        }

        .notice {
            display: none;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .notice.info {
            display: block;
            background: #e0f2fe;
            color: #075985;
            border: 1px solid #7dd3fc;
        }

        .notice.error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #fca5a5;
        }

        .table-box {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #334155;
            font-size: 0.76rem;
            font-weight: 600;
        }

        .empty {
            padding: 32px 16px;
            text-align: center;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <div>
            <h1>Übersicht Spiele – Wesermarschpokal</h1>
            <p>Sortiert nach Spieldatum • PDF-Öffnung im Reader ohne Download</p>
        </div>
        <div class="toolbar">
            <button type="button" class="btn btn-muted btn-sm" id="refreshBtn">Aktualisieren</button>
            <a href="index.html" class="btn btn-sm">&larr; Spielformular</a>
        </div>
    </div>

    <div class="filters">
        <input type="search" id="searchBox" placeholder="Verein, Datum oder Spielklasse suchen...">
        <select id="classFilter">
            <option value="">Alle Spielklassen</option>
            <option value="Erwachsene">Erwachsene</option>
            <option value="Jugend 19">Jugend 19</option>
            <option value="Jugend 15">Jugend 15</option>
        </select>
        <select id="sortSelect">
            <option value="desc">Spieldatum: Neueste zuerst</option>
            <option value="asc">Spieldatum: Älteste zuerst</option>
        </select>
    </div>

    <div id="notice" class="notice"></div>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>Spieldatum</th>
                    <th>Uhrzeit</th>
                    <th>Spielklasse</th>
                    <th>Heim</th>
                    <th>Gast</th>
                    <th>Sätze</th>
                    <th>Punkte</th>
                    <th>Bälle</th>
                    <th>Report</th>
                </tr>
            </thead>
            <tbody id="gamesBody">
                <tr>
                    <td colspan="9" class="empty">Lade Spiele...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const REPO_OWNER = 'Wesermarschpokal';
    const REPO_NAME = 'Wesermarschpokal';
    const ARCHIVE_FOLDER = 'archiv';

    let games = [];

    function showNotice(type, text) {
        const el = document.getElementById('notice');
        if (!text) {
            el.className = 'notice';
            el.textContent = '';
            return;
        }
        el.className = `notice ${type}`;
        el.textContent = text;
    }

    function parseMatchDateMs(game) {
        const dStr = String(game?.datum || '').trim();
        const m = dStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return null;

        const year = Number(m[1]);
        const month = Number(m[2]) - 1;
        const day = Number(m[3]);

        let hour = 0;
        let minute = 0;
        const tStr = String(game?.uhrzeit || '').trim();
        const tm = tStr.match(/^(\d{1,2}):(\d{2})$/);
        if (tm) {
            hour = Number(tm[1]) || 0;
            minute = Number(tm[2]) || 0;
        }

        const ms = new Date(year, month, day, hour, minute, 0, 0).getTime();
        return Number.isFinite(ms) ? ms : null;
    }

    function formatDateDE(isoDate) {
        const m = String(isoDate || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return isoDate || '–';
        return `${m[3]}.${m[2]}.${m[1]}`;
    }

    function sortByMatchDate(list, direction) {
        const factor = direction === 'asc' ? 1 : -1;
        return [...list].sort((a, b) => {
            const msA = parseMatchDateMs(a);
            const msB = parseMatchDateMs(b);

            if (msA === null && msB === null) {
                return (b.timestamp || 0) - (a.timestamp || 0);
            }
            if (msA === null) return 1;
            if (msB === null) return -1;

            if (msA !== msB) {
                return (msA - msB) * factor;
            }
            return (b.timestamp || 0) - (a.timestamp || 0);
        });
    }

    function decodeBase64Text(base64) {
        const binary = atob(String(base64 || '').replace(/\s+/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    }

    function pdfDataToBlobUrl(pdfData) {
        if (!pdfData || typeof pdfData !== 'string') return null;
        const rawBase64 = pdfData.includes(',') ? pdfData.split(',')[1] : pdfData;
        const cleanBase64 = rawBase64.replace(/\s+/g, '');
        const binary = atob(cleanBase64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: 'application/pdf' });
        return URL.createObjectURL(blob);
    }

    function openReportInReader(game) {
        if (!game || !game.pdfData) {
            alert('Kein PDF-Report für dieses Spiel vorhanden.');
            return;
        }

        // Synchron im Klick-Handler öffnen, damit der Browser den Reader/Tab nicht blockiert
        const readerWin = window.open('', '_blank');

        try {
            const blobUrl = pdfDataToBlobUrl(game.pdfData);
            if (!blobUrl) {
                if (readerWin) readerWin.close();
                alert('PDF-Daten konnten nicht gelesen werden.');
                return;
            }

            if (readerWin) {
                readerWin.location.replace(blobUrl);
            } else {
                window.location.href = blobUrl;
            }

            setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
        } catch (err) {
            if (readerWin) readerWin.close();
            alert('Fehler beim Öffnen des PDFs: ' + err.message);
        }
    }

    async function loadGames() {
        showNotice('info', 'Spiele werden geladen...');
        const tbody = document.getElementById('gamesBody');
        tbody.innerHTML = '<tr><td colspan="9" class="empty">Lade Spiele...</td></tr>';

        try {
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${ARCHIVE_FOLDER}`;
            const res = await fetch(apiUrl);

            if (res.status === 404) {
                games = [];
                showNotice('', '');
                renderTable();
                return;
            }

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const entries = await res.json();
            const jsonFiles = Array.isArray(entries)
                ? entries.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.json'))
                : [];

            const parsedGames = await Promise.all(jsonFiles.map(async (file) => {
                try {
                    const fRes = await fetch(file.url);
                    if (!fRes.ok) return null;
                    const fData = await fRes.json();
                    const jsonText = fData.content
                        ? decodeBase64Text(fData.content)
                        : await (await fetch(file.download_url)).text();
                    return JSON.parse(jsonText);
                } catch (_) {
                    return null;
                }
            }));

            games = parsedGames.filter(Boolean);
            showNotice('', '');
            renderTable();
        } catch (err) {
            showNotice('error', `Fehler beim Laden der Spiele: ${err.message}`);
            tbody.innerHTML = '<tr><td colspan="9" class="empty">Keine Spiele geladen.</td></tr>';
        }
    }

    function renderTable() {
        const tbody = document.getElementById('gamesBody');
        const query = document.getElementById('searchBox').value.trim().toLowerCase();
        const klasse = document.getElementById('classFilter').value;
        const direction = document.getElementById('sortSelect').value;

        const sorted = sortByMatchDate(games, direction);
        const filtered = sorted.filter(g => {
            const matchesClass = !klasse || (g.spielklasse || '') === klasse;
            const searchHaystack = [
                g.datum || '',
                formatDateDE(g.datum),
                g.spielklasse || '',
                g.heimName || '',
                g.gastName || ''
            ].join(' ').toLowerCase();
            const matchesQuery = !query || searchHaystack.includes(query);
            return matchesClass && matchesQuery;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">Keine Spiele gefunden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';

        filtered.forEach(game => {
            const tr = document.createElement('tr');

            const rowValues = [
                formatDateDE(game.datum),
                game.uhrzeit || '–',
                null,
                game.heimName || '–',
                game.gastName || '–',
                game.saetze || '0 : 0',
                game.punkte || '0 : 0',
                game.baelle || '0 : 0'
            ];

            rowValues.forEach((val, i) => {
                const td = document.createElement('td');
                if (i === 2) {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = game.spielklasse || '–';
                    td.appendChild(span);
                } else {
                    td.textContent = val;
                }
                if (i >= 5) td.style.fontWeight = '600';
                tr.appendChild(td);
            });

            const actionTd = document.createElement('td');
            if (game.pdfData) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-sm';
                btn.textContent = 'PDF öffnen';
                btn.addEventListener('click', () => openReportInReader(game));
                actionTd.appendChild(btn);
            } else {
                actionTd.textContent = '–';
            }
            tr.appendChild(actionTd);

            tbody.appendChild(tr);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('refreshBtn').addEventListener('click', loadGames);
        document.getElementById('searchBox').addEventListener('input', renderTable);
        document.getElementById('classFilter').addEventListener('change', renderTable);
        document.getElementById('sortSelect').addEventListener('change', renderTable);
        loadGames();
    });
</script>
</body>
</html>
