<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übersicht Spiele – Wesermarschpokal</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --warning-bg: #fef9c3;
            --warning-text: #854d0e;
            --warning-border: #fde047;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            position: relative;
        }

        /* Burger Menu Navigation */
        .burger-menu-container {
            position: absolute;
            top: 45px;
            left: 20px;
            z-index: 100;
        }

        .burger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 22px;
        }

        .burger-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--primary);
            border-radius: 2px;
        }

        .drawer-menu {
            display: none;
            position: absolute;
            top: 35px;
            left: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 240px;
            padding: 10px 0;
            z-index: 101;
        }

        .drawer-menu.active { display: block; }

        .drawer-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            background: none;
            border: none;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            box-sizing: border-box;
        }

        .drawer-btn:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .header-print {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .header-title h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header-title p {
            margin: 2px 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
        }

        .btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            align-items: center;
        }

        .filter-controls input,
        .filter-controls select {
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            background: #ffffff;
        }

        .filter-controls input {
            flex: 1;
            min-width: 190px;
        }

        .status-box {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 0.84rem;
            display: none;
        }

        .status-box.info {
            display: block;
            background: #e0f2fe;
            color: #075985;
            border: 1px solid #7dd3fc;
        }

        .status-box.db-error {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fca5a5;
            cursor: pointer;
            font-weight: 600;
        }

        .status-box.db-error:hover {
            background: #fecaca;
        }

        /* Hinweisfenster (Modal) */
        .error-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .error-modal-backdrop.active {
            display: flex;
        }

        .error-modal {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 540px;
            width: 100%;
            padding: 18px 20px;
        }

        .error-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .error-modal-header h3 {
            margin: 0;
            font-size: 1.05rem;
            color: var(--danger-text);
        }

        .error-modal-close {
            background: none;
            border: none;
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
            padding: 2px 6px;
        }

        .error-modal-close:hover {
            color: var(--text-main);
        }

        .error-modal-body {
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            max-height: 280px;
            overflow-y: auto;
        }

        .error-modal-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
            color: var(--text-main);
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #334155;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="burger-menu-container">
        <button type="button" class="burger-btn" id="burgerBtn" title="Menü öffnen">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="drawer-menu" id="drawerMenu">
            <a href="index.html" class="drawer-btn">📝 Spielbericht</a>
            <a href="uebersicht_spiele.html" class="drawer-btn">📋 Übersicht Spiele</a>
            <a href="statistik.html" class="drawer-btn">📊 Statistik</a>
        </div>
    </div>

    <div class="header-print">
        <div class="header-title">
            <h1>Tischtennis Kreisverband Wesermarsch e.V.</h1>
            <p>Übersicht der abgeschlossenen Begegnungen</p>
        </div>
    </div>

    <div class="actions-bar">
        <button type="button" class="btn btn-secondary btn-sm" id="btnRefresh">🔄 Aktualisieren</button>
    </div>

    <div class="filter-controls">
        <input type="text" id="searchInput" placeholder="Suche nach Verein, Datum oder Spielklasse...">
        <select id="saisonFilter" title="Spielzeit / Saison"></select>
        <select id="vereinFilter" title="Verein (mannschaftsunabhängig)">
            <option value="">Alle Vereine</option>
        </select>
        <select id="klasseFilter">
            <option value="">Alle Spielklassen</option>
            <option value="Erwachsene">Erwachsene</option>
            <option value="Jugend 19">Jugend 19</option>
            <option value="Jugend 15">Jugend 15</option>
        </select>
        <select id="sortOrderSelect" title="Chronologische Sortierung nach Spieldatum">
            <option value="desc">Spieldatum: Neueste zuerst</option>
            <option value="asc">Spieldatum: Älteste zuerst</option>
        </select>
    </div>

    <div id="statusBox" class="status-box" role="button" tabindex="0"></div>

    <div class="error-modal-backdrop" id="errorModalBackdrop" aria-hidden="true">
        <div class="error-modal" role="dialog" aria-modal="true" aria-labelledby="errorModalTitle">
            <div class="error-modal-header">
                <h3 id="errorModalTitle">Datenbankfehler</h3>
                <button type="button" class="error-modal-close" id="errorModalClose" title="Schließen">&times;</button>
            </div>
            <div class="error-modal-body" id="errorModalBody"></div>
            <div class="error-modal-footer">
                <button type="button" class="btn btn-sm" id="errorModalOk">Schließen</button>
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Spieldatum</th>
                    <th>Uhrzeit</th>
                    <th>Spielklasse</th>
                    <th>Heimmannschaft</th>
                    <th>Gastmannschaft</th>
                    <th>Sätze</th>
                    <th>Punkte</th>
                    <th>Bälle</th>
                    <th>Spielbericht</th>
                </tr>
            </thead>
            <tbody id="gamesTableBody">
                <tr>
                    <td colspan="9" class="empty-state">Lade gespeicherte Spiele...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const GITHUB_USER = 'Wesermarschpokal';
    const GITHUB_REPO = 'Wesermarschpokal';
    const ARCHIV_PATH = 'archiv';

    let allGames = [];
    let lastErrorDescription = '';

    function openErrorModal() {
        if (!lastErrorDescription) return;
        const backdrop = document.getElementById('errorModalBackdrop');
        const body = document.getElementById('errorModalBody');
        if (!backdrop || !body) return;
        body.textContent = lastErrorDescription;
        backdrop.classList.add('active');
        backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeErrorModal() {
        const backdrop = document.getElementById('errorModalBackdrop');
        if (!backdrop) return;
        backdrop.classList.remove('active');
        backdrop.setAttribute('aria-hidden', 'true');
    }

    function setInfoStatus(message) {
        lastErrorDescription = '';
        const box = document.getElementById('statusBox');
        if (!message) {
            box.className = 'status-box';
            box.textContent = '';
            return;
        }
        box.className = 'status-box info';
        box.textContent = message;
    }

    function setDbError(description) {
        lastErrorDescription = description || 'Unbekannter Datenbankfehler beim Laden der Spielberichte.';
        const box = document.getElementById('statusBox');
        box.className = 'status-box db-error';
        box.textContent = '⚠️ Datenbankfehler';
    }

    function extractClubName(teamName) {
        let name = String(teamName || '').trim().replace(/\s+/g, ' ');
        if (!name) return '';

        let prev = '';
        while (name && name !== prev) {
            prev = name;
            name = name
                .replace(/\s+\d+\s*[-–/]\s*\d+$/i, '')
                .replace(/\s+(?:U\d+|J\d+|mU\d+|wU\d+|mJ\d+|wJ\d+)$/i, '')
                .replace(/\s+(?:I{1,4}|IV|V|VI{0,3})$/i, '')
                .replace(/\s+\d+$/i, '')
                .trim();
        }

        return name || String(teamName || '').trim().replace(/\s+/g, ' ');
    }

    function getSeasonFromDateStr(dateStr) {
        const raw = (dateStr || '').trim();
        let year = null;
        let month = null;

        const isoMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (isoMatch) {
            year = parseInt(isoMatch[1], 10);
            month = parseInt(isoMatch[2], 10);
        } else {
            const deMatch = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (deMatch) {
                month = parseInt(deMatch[2], 10);
                year = parseInt(deMatch[3], 10);
            }
        }

        if (!year || !month || month < 1 || month > 12) {
            return '';
        }

        const startYear = month >= 9 ? year : year - 1;
        return `${startYear}/${startYear + 1}`;
    }

    function getSeasonStartYear(seasonStr) {
        const match = String(seasonStr || '').match(/^(\d{4})\/\d{4}$/);
        return match ? parseInt(match[1], 10) : -1;
    }

    function populateSeasonDropdown() {
        const select = document.getElementById('saisonFilter');
        if (!select) return;
        const prevVal = select.value;

        const seasonSet = new Set();
        allGames.forEach(g => {
            const season = getSeasonFromDateStr(g?.datum);
            if (season) seasonSet.add(season);
        });

        const sortedSeasons = [...seasonSet].sort((a, b) => getSeasonStartYear(b) - getSeasonStartYear(a));

        select.innerHTML = '';
        if (sortedSeasons.length === 0) {
            select.add(new Option('Keine Spielzeit vorhanden', ''));
            select.value = '';
            return;
        }

        sortedSeasons.forEach(season => {
            select.add(new Option(season, season));
        });

        if (prevVal && sortedSeasons.includes(prevVal)) {
            select.value = prevVal;
        } else {
            select.value = sortedSeasons[0];
        }
    }

    function populateClubDropdown() {
        const select = document.getElementById('vereinFilter');
        if (!select) return;
        const prevVal = select.value;
        const selectedSeason = document.getElementById('saisonFilter').value;
        const selectedKlasse = document.getElementById('klasseFilter').value;

        const clubMap = new Map();
        allGames.forEach(g => {
            const gameSeason = getSeasonFromDateStr(g?.datum);
            if (selectedSeason && gameSeason !== selectedSeason) return;
            if (selectedKlasse && (g.spielklasse || '') !== selectedKlasse) return;

            [g.heimName, g.gastName].forEach(name => {
                const club = extractClubName(name);
                const key = club.toLowerCase();
                if (club && !clubMap.has(key)) {
                    clubMap.set(key, club);
                }
            });
        });

        const sortedClubs = [...clubMap.values()].sort((a, b) => a.localeCompare(b, 'de'));

        select.innerHTML = '<option value="">Alle Vereine</option>';
        sortedClubs.forEach(club => {
            select.add(new Option(club, club.toLowerCase()));
        });

        if (prevVal && [...select.options].some(o => o.value === prevVal)) {
            select.value = prevVal;
        } else {
            select.value = '';
        }
    }

    function getMatchDateSortValue(game) {
        const rawDate = (game && game.datum ? String(game.datum) : '').trim();
        const dateMatch = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!dateMatch) {
            return null;
        }

        const year = parseInt(dateMatch[1], 10);
        const month = parseInt(dateMatch[2], 10) - 1;
        const day = parseInt(dateMatch[3], 10);

        let hours = 0;
        let minutes = 0;
        const rawTime = (game && game.uhrzeit ? String(game.uhrzeit) : '').trim();
        const timeMatch = rawTime.match(/^(\d{1,2}):(\d{2})$/);
        if (timeMatch) {
            hours = parseInt(timeMatch[1], 10) || 0;
            minutes = parseInt(timeMatch[2], 10) || 0;
        }

        const dt = new Date(year, month, day, hours, minutes, 0, 0);
        return isNaN(dt.getTime()) ? null : dt.getTime();
    }

    function formatGermanDate(dateStr) {
        const match = (dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return dateStr || '–';
        return `${match[3]}.${match[2]}.${match[1]}`;
    }

    function sortGamesByMatchDate(games, order = 'desc') {
        const direction = order === 'asc' ? 1 : -1;

        return [...games].sort((a, b) => {
            const timeA = getMatchDateSortValue(a);
            const timeB = getMatchDateSortValue(b);

            if (timeA === null && timeB === null) {
                return ((b.timestamp || 0) - (a.timestamp || 0));
            }
            if (timeA === null) return 1;
            if (timeB === null) return -1;

            if (timeA !== timeB) {
                return (timeA - timeB) * direction;
            }

            return ((b.timestamp || 0) - (a.timestamp || 0));
        });
    }

    function getArchiveDownloadUrl(file) {
        if (file && typeof file.download_url === 'string' && file.download_url.trim()) {
            return file.download_url.trim();
        }
        const safeName = encodeURIComponent(file?.name || '');
        return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${ARCHIV_PATH}/${safeName}`;
    }

    async function loadGamesFromGitHub() {
        setInfoStatus('Spiele werden aus dem Archiv geladen...');
        const tbody = document.getElementById('gamesTableBody');
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Lade Spiele...</td></tr>';

        try {
            const dirUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARCHIV_PATH}`;
            const dirRes = await fetch(dirUrl, { cache: 'no-store' });

            if (dirRes.status === 404) {
                allGames = [];
                setInfoStatus('');
                populateSeasonDropdown();
                populateClubDropdown();
                renderGames();
                return;
            }

            if (!dirRes.ok) {
                throw new Error(`Archiv-Verzeichnis konnte nicht geladen werden (HTTP ${dirRes.status}).`);
            }

            const files = await dirRes.json();
            const jsonFiles = Array.isArray(files)
                ? files.filter(f => f && f.type === 'file' && String(f.name || '').toLowerCase().endsWith('.json'))
                : [];

            const fileErrors = [];

            const loaded = await Promise.all(jsonFiles.map(async (file) => {
                const fileName = file?.name || 'unbekannte_datei.json';
                const downloadUrl = getArchiveDownloadUrl(file);
                try {
                    const res = await fetch(downloadUrl, { cache: 'no-store' });
                    if (!res.ok) {
                        const reason = `Download fehlgeschlagen (HTTP ${res.status})`;
                        console.error(`[Archiv] ${fileName}: ${reason} (${downloadUrl})`);
                        fileErrors.push(`${fileName}: ${reason}`);
                        return null;
                    }

                    const rawText = await res.text();
                    if (!rawText || !rawText.trim()) {
                        const reason = 'Datei ist leer';
                        console.error(`[Archiv] ${fileName}: ${reason}`);
                        fileErrors.push(`${fileName}: ${reason}`);
                        return null;
                    }

                    let parsed;
                    try {
                        parsed = JSON.parse(rawText);
                    } catch (parseErr) {
                        const reason = `Ungültiges JSON (${parseErr.message})`;
                        console.error(`[Archiv] ${fileName}: ${reason}`);
                        fileErrors.push(`${fileName}: ${reason}`);
                        return null;
                    }

                    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                        const reason = 'JSON-Inhalt ist kein gültiges Spielbericht-Objekt';
                        console.error(`[Archiv] ${fileName}: ${reason}`);
                        fileErrors.push(`${fileName}: ${reason}`);
                        return null;
                    }

                    return {
                        ...parsed,
                        _fileName: fileName
                    };
                } catch (err) {
                    const reason = `Netzwerk-/Ladefehler (${err.message || err})`;
                    console.error(`[Archiv] ${fileName}: ${reason}`, err);
                    fileErrors.push(`${fileName}: ${reason}`);
                    return null;
                }
            }));

            allGames = loaded.filter(Boolean);

            if (fileErrors.length > 0) {
                setDbError(
                    `${fileErrors.length} Spielbericht${fileErrors.length === 1 ? '' : 'e'} im Archiv konnte${fileErrors.length === 1 ? '' : 'n'} nicht geladen werden:\n\n` +
                    fileErrors.join('\n')
                );
            } else {
                setInfoStatus('');
            }

            populateSeasonDropdown();
            populateClubDropdown();
            renderGames();
        } catch (err) {
            console.error(err);
            setDbError(`Fehler beim Laden der Spielberichte:\n${err.message || err}`);
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Keine Daten verfügbar.</td></tr>';
        }
    }

    function pdfDataToBlob(pdfData) {
        if (!pdfData || typeof pdfData !== 'string') {
            return null;
        }

        if (pdfData.startsWith('blob:')) {
            return pdfData;
        }

        const base64Part = pdfData.includes(',') ? pdfData.split(',')[1] : pdfData;
        const cleanBase64 = base64Part.replace(/\s/g, '');
        const binaryStr = atob(cleanBase64);
        const len = binaryStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }
        return new Blob([bytes], { type: 'application/pdf' });
    }

    function openUrlSafely(url) {
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        anchor.style.display = 'none';
        document.body.appendChild(anchor);
        anchor.click();
        setTimeout(() => {
            if (anchor.parentNode) anchor.parentNode.removeChild(anchor);
        }, 1000);
    }

    function openPdfPreview(game) {
        if (!game || !game.pdfData) {
            alert('Für dieses Spiel ist kein PDF hinterlegt.');
            return;
        }

        let popupWin = null;
        try {
            popupWin = window.open('', '_blank');
            if (popupWin && !popupWin.closed) {
                try {
                    popupWin.document.title = 'Spielbericht wird geöffnet...';
                    popupWin.document.body.innerHTML = '<p style="font-family:sans-serif;padding:16px;">PDF wird vorbereitet...</p>';
                } catch (_) {}
            }
        } catch (_) {
            popupWin = null;
        }

        try {
            const pdfSource = pdfDataToBlob(game.pdfData);
            if (!pdfSource) {
                if (popupWin && !popupWin.closed) popupWin.close();
                alert('Ungültige PDF-Daten.');
                return;
            }

            const blobUrl = typeof pdfSource === 'string'
                ? pdfSource
                : URL.createObjectURL(pdfSource);

            if (popupWin && !popupWin.closed) {
                try {
                    popupWin.location.replace(blobUrl);
                } catch (_) {
                    popupWin.location.href = blobUrl;
                }
            } else {
                openUrlSafely(blobUrl);
            }

            if (typeof pdfSource !== 'string') {
                setTimeout(() => URL.revokeObjectURL(blobUrl), 120000);
            }
        } catch (err) {
            if (popupWin && !popupWin.closed) popupWin.close();
            console.error('Fehler beim Öffnen des PDFs:', err);
            alert('PDF konnte nicht geöffnet werden.');
        }
    }

    function renderGames() {
        const tbody = document.getElementById('gamesTableBody');
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        const selectedSeason = document.getElementById('saisonFilter').value;
        const selectedClub = document.getElementById('vereinFilter').value;
        const selectedKlasse = document.getElementById('klasseFilter').value;
        const sortOrder = document.getElementById('sortOrderSelect').value;

        const sorted = sortGamesByMatchDate(allGames, sortOrder);

        const filtered = sorted.filter(g => {
            const gameSeason = getSeasonFromDateStr(g?.datum);
            const matchesSeason = !selectedSeason || gameSeason === selectedSeason;
            const heimClubKey = extractClubName(g.heimName).toLowerCase();
            const gastClubKey = extractClubName(g.gastName).toLowerCase();
            const matchesClub = !selectedClub || heimClubKey === selectedClub || gastClubKey === selectedClub;
            const matchesKlasse = !selectedKlasse || (g.spielklasse || '') === selectedKlasse;
            const haystack = [
                g.datum || '',
                formatGermanDate(g.datum),
                gameSeason,
                g.spielklasse || '',
                g.heimName || '',
                g.gastName || '',
                heimClubKey,
                gastClubKey
            ].join(' ').toLowerCase();
            const matchesSearch = !searchTerm || haystack.includes(searchTerm);
            return matchesSeason && matchesClub && matchesKlasse && matchesSearch;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Keine passenden Spiele gefunden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        filtered.forEach(game => {
            const tr = document.createElement('tr');

            const cells = [
                formatGermanDate(game.datum),
                game.uhrzeit || '–',
                null,
                game.heimName || '–',
                game.gastName || '–',
                game.saetze || '0 : 0',
                game.punkte || '0 : 0',
                game.baelle || '0 : 0'
            ];

            cells.forEach((val, idx) => {
                const td = document.createElement('td');
                if (idx === 2) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = game.spielklasse || '–';
                    td.appendChild(badge);
                } else {
                    td.textContent = val;
                }
                if (idx === 5 || idx === 6 || idx === 7) {
                    td.style.fontWeight = '600';
                }
                tr.appendChild(td);
            });

            const actionTd = document.createElement('td');
            if (game.pdfData) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-sm';
                btn.textContent = '📄 PDF';
                btn.addEventListener('click', () => openPdfPreview(game));
                actionTd.appendChild(btn);
            } else {
                actionTd.textContent = '–';
            }
            tr.appendChild(actionTd);

            tbody.appendChild(tr);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const burgerBtn = document.getElementById('burgerBtn');
        const drawerMenu = document.getElementById('drawerMenu');
        if (burgerBtn && drawerMenu) {
            burgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                drawerMenu.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!drawerMenu.contains(e.target) && !burgerBtn.contains(e.target)) {
                    drawerMenu.classList.remove('active');
                }
            });
        }

        const statusBox = document.getElementById('statusBox');
        if (statusBox) {
            statusBox.addEventListener('click', () => {
                if (statusBox.classList.contains('db-error')) {
                    openErrorModal();
                }
            });
            statusBox.addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && statusBox.classList.contains('db-error')) {
                    e.preventDefault();
                    openErrorModal();
                }
            });
        }

        const modalBackdrop = document.getElementById('errorModalBackdrop');
        document.getElementById('errorModalClose')?.addEventListener('click', closeErrorModal);
        document.getElementById('errorModalOk')?.addEventListener('click', closeErrorModal);
        modalBackdrop?.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) closeErrorModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeErrorModal();
        });

        document.getElementById('btnRefresh').addEventListener('click', loadGamesFromGitHub);
        document.getElementById('searchInput').addEventListener('input', renderGames);
        document.getElementById('saisonFilter').addEventListener('change', () => {
            populateClubDropdown();
            renderGames();
        });
        document.getElementById('vereinFilter').addEventListener('change', renderGames);
        document.getElementById('klasseFilter').addEventListener('change', () => {
            populateClubDropdown();
            renderGames();
        });
        document.getElementById('sortOrderSelect').addEventListener('change', renderGames);

        loadGamesFromGitHub();
    });
</script>
</body>
</html>
