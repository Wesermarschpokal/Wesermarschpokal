<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übersicht Spiele - Wesermarschpokal</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.3rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); }

        .spiel-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .spiel-info h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
            color: var(--text-main);
        }

        .spiel-info p {
            margin: 0;
            font-size: 0.8rem;
            color: #64748b;
        }

        .spiel-details {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary);
        }

        .loading, .no-games {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Übersicht gespeicherte Spiele</h1>
        <a href="index.html" class="btn">&larr; Zum Formular</a>
    </div>

    <div id="spieleContainer">
        <div class="loading">Lade Spielberichte aus der Cloud (GitHub)...</div>
    </div>
</div>

<script>
    const GITHUB_USER = 'Wesermarschpokal';
    const GITHUB_REPO = 'Wesermarschpokal';

    async function loadGamesFromGitHub() {
        const container = document.getElementById('spieleContainer');
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/archiv`;

        try {
            const response = await fetch(url);
            if (!response.ok) {
                container.innerHTML = '<div class="no-games">Noch keine Spielberichte vorhanden oder Ordner "archiv" ist leer.</div>';
                return;
            }

            const files = await response.json();
            let archives = [];

            for (const file of files) {
                if (file.name.endsWith('.json')) {
                    const fileRes = await fetch(file.download_url);
                    const gameData = await fileRes.json();
                    archives.push(gameData);
                }
            }

            if (archives.length === 0) {
                container.innerHTML = '<div class="no-games">Keine Spielberichte im Archiv gefunden.</div>';
                return;
            }

            // Neueste Spiele zuerst anzeigen
            archives.sort((a, b) => b.timestamp - a.timestamp);

            container.innerHTML = '';
            archives.forEach(spiel => {
                let card = document.createElement('div');
                card.className = 'spiel-card';
                card.innerHTML = `
                    <div class="spiel-info">
                        <h3>${spiel.heimName} vs. ${spiel.gastName}</h3>
                        <p>Klasse: <strong>${spiel.spielklasse}</strong> | Datum: ${spiel.datum || 'Unbekannt'} (${spiel.uhrzeit || ''})</p>
                    </div>
                    <div>
                        <span class="spiel-details">Sätze: ${spiel.saetze} | Pkt: ${spiel.punkte}</span>
                    </div>
                    <div>
                        ${spiel.pdfData ? `<button class="btn" onclick="openPdfFromData('${spiel.pdfData}')">📄 PDF öffnen</button>` : '<span style="font-size:0.8rem;color:#64748b;">Kein PDF</span>'}
                    </div>
                `;
                container.appendChild(card);
            });

        } catch (e) {
            console.error("Fehler beim Laden:", e);
            container.innerHTML = '<div class="no-games">Fehler beim Laden der Spielberichte von GitHub. Bitte Internetverbindung prüfen.</div>';
        }
    }

    function openPdfFromData(dataUri) {
        const byteString = atob(dataUri.split(',')[1]);
        const mimeString = dataUri.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: mimeString });
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl, '_blank');
    }

    document.addEventListener('DOMContentLoaded', loadGamesFromGitHub);
</script>

</body>
</html>
