<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übersicht Spiele – Wesermarschpokal</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .title-group h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.35rem;
        }

        .title-group p {
            margin: 3px 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            align-items: center;
        }

        .filter-controls input,
        .filter-controls select {
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            background: #ffffff;
        }

        .filter-controls input {
            flex: 1;
            min-width: 200px;
        }

        .status-box {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .status-box.info {
            display: block;
            background: #e0f2fe;
            color: #075985;
            border: 1px solid #7dd3fc;
        }

        .status-box.error {
            display: block;
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fca5a5;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
            color: var(--text-main);
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #334155;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="title-group">
            <h1>Übersicht Spiele – Wesermarschpokal</h1>
            <p>Chronologisch sortiert nach Spieldatum</p>
        </div>
        <div class="actions-bar">
            <button type="button" class="btn btn-secondary btn-sm" id="btnRefresh">🔄 Aktualisieren</button>
            <a href="index.html" class="btn btn-sm">&larr; Zum Spielformular</a>
        </div>
    </div>

    <div class="filter-controls">
        <input type="text" id="searchInput" placeholder="Suche nach Verein, Datum oder Spielklasse...">
        <select id="klasseFilter">
            <option value="">Alle Spielklassen</option>
            <option value="Erwachsene">Erwachsene</option>
            <option value="Jugend 19">Jugend 19</option>
            <option value="Jugend 15">Jugend 15</option>
        </select>
        <select id="sortOrderSelect" title="Chronologische Sortierung nach Spieldatum">
            <option value="desc">Spieldatum: Neueste zuerst</option>
            <option value="asc">Spieldatum: Älteste zuerst</option>
        </select>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Spieldatum</th>
                    <th>Uhrzeit</th>
                    <th>Spielklasse</th>
                    <th>Heimmannschaft</th>
                    <th>Gastmannschaft</th>
                    <th>Sätze</th>
                    <th>Punkte</th>
                    <th>Bälle</th>
                    <th>Spielbericht</th>
                </tr>
            </thead>
            <tbody id="gamesTableBody">
                <tr>
                    <td colspan="9" class="empty-state">Lade gespeicherte Spiele...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const GITHUB_USER = 'Wesermarschpokal';
    const GITHUB_REPO = 'Wesermarschpokal';
    const ARCHIV_PATH = 'archiv';

    let allGames = [];

    function setStatus(type, message) {
        const box = document.getElementById('statusBox');
        if (!message) {
            box.className = 'status-box';
            box.textContent = '';
            return;
        }
        box.className = `status-box ${type}`;
        box.textContent = message;
    }

    function getMatchDateSortValue(game) {
        const rawDate = (game && game.datum ? String(game.datum) : '').trim();
        const dateMatch = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!dateMatch) {
            return null;
        }

        const year = parseInt(dateMatch[1], 10);
        const month = parseInt(dateMatch[2], 10) - 1;
        const day = parseInt(dateMatch[3], 10);

        let hours = 0;
        let minutes = 0;
        const rawTime = (game && game.uhrzeit ? String(game.uhrzeit) : '').trim();
        const timeMatch = rawTime.match(/^(\d{1,2}):(\d{2})$/);
        if (timeMatch) {
            hours = parseInt(timeMatch[1], 10) || 0;
            minutes = parseInt(timeMatch[2], 10) || 0;
        }

        const dt = new Date(year, month, day, hours, minutes, 0, 0);
        return isNaN(dt.getTime()) ? null : dt.getTime();
    }

    function formatGermanDate(dateStr) {
        const match = (dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return dateStr || '–';
        return `${match[3]}.${match[2]}.${match[1]}`;
    }

    function sortGamesByMatchDate(games, order = 'desc') {
        const direction = order === 'asc' ? 1 : -1;

        return [...games].sort((a, b) => {
            const timeA = getMatchDateSortValue(a);
            const timeB = getMatchDateSortValue(b);

            if (timeA === null && timeB === null) {
                return ((b.timestamp || 0) - (a.timestamp || 0));
            }
            if (timeA === null) return 1;
            if (timeB === null) return -1;

            if (timeA !== timeB) {
                return (timeA - timeB) * direction;
            }

            return ((b.timestamp || 0) - (a.timestamp || 0));
        });
    }

    function decodeBase64Utf8(base64Str) {
        const clean = (base64Str || '').replace(/\n/g, '');
        const binaryStr = atob(clean);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    }

    function createPdfFile(game) {
        const pdfData = game && game.pdfData;
        if (!pdfData || typeof pdfData !== 'string') return null;

        let base64Part = pdfData.trim();
        if (base64Part.includes(',')) {
            base64Part = base64Part.split(',')[1];
        }

        const cleanBase64 = base64Part.replace(/\s+/g, '');
        const binaryStr = atob(cleanBase64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }

        const safeHeim = (game.heimName || 'Heim').replace(/[^a-zA-Z0-9_-]/g, '_');
        const safeGast = (game.gastName || 'Gast').replace(/[^a-zA-Z0-9_-]/g, '_');
        const datumPart = game.datum || 'Pokal';
        const fileName = `Spielbericht_${datumPart}_${safeHeim}_vs_${safeGast}.pdf`;

        return new File([bytes], fileName, { type: 'application/pdf' });
    }

    async function openPdfPreview(game) {
        if (!game || !game.pdfData) {
            alert('Für dieses Spiel ist kein PDF hinterlegt.');
            return;
        }

        try {
            const pdfFile = createPdfFile(game);
            if (!pdfFile) {
                alert('Das PDF konnte nicht verarbeitet werden.');
                return;
            }

            if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [pdfFile] }))) {
                await navigator.share({
                    title: pdfFile.name,
                    files: [pdfFile]
                });
                return;
            }

            const blobUrl = URL.createObjectURL(pdfFile);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
        } catch (err) {
            if (err && err.name === 'AbortError') {
                return;
            }
            console.error('Fehler beim Teilen/Öffnen des PDFs:', err);
            alert('Fehler beim Öffnen des PDF-Reports: ' + err.message);
        }
    }

    async function loadGamesFromGitHub() {
        setStatus('info', 'Spiele werden aus dem Archiv geladen...');
        const tbody = document.getElementById('gamesTableBody');
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Lade Spiele...</td></tr>';

        try {
            const dirUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARCHIV_PATH}`;
            const dirRes = await fetch(dirUrl);

            if (dirRes.status === 404) {
                allGames = [];
                setStatus('', '');
                renderGames();
                return;
            }

            if (!dirRes.ok) {
                throw new Error(`GitHub-API Fehler (${dirRes.status})`);
            }

            const files = await dirRes.json();
            const jsonFiles = Array.isArray(files)
                ? files.filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.json'))
                : [];

            const loaded = await Promise.all(jsonFiles.map(async (file) => {
                try {
                    const fileRes = await fetch(file.url);
                    if (!fileRes.ok) return null;
                    const fileJson = await fileRes.json();
                    const rawContent = fileJson.content
                        ? decodeBase64Utf8(fileJson.content)
                        : await (await fetch(file.download_url)).text();
                    const parsed = JSON.parse(rawContent);
                    return {
                        ...parsed,
                        _fileName: file.name
                    };
                } catch (err) {
                    console.warn('Fehler beim Lesen einer Spieldatei:', file.name, err);
                    return null;
                }
            }));

            allGames = loaded.filter(Boolean);
            setStatus('', '');
            renderGames();
        } catch (err) {
            console.error(err);
            setStatus('error', `Spiele konnten nicht geladen werden: ${err.message}`);
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Keine Daten verfügbar.</td></tr>';
        }
    }

    function renderGames() {
        const tbody = document.getElementById('gamesTableBody');
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        const selectedKlasse = document.getElementById('klasseFilter').value;
        const sortOrder = document.getElementById('sortOrderSelect').value;

        const sorted = sortGamesByMatchDate(allGames, sortOrder);

        const filtered = sorted.filter(g => {
            const matchesKlasse = !selectedKlasse || (g.spielklasse || '') === selectedKlasse;
            const haystack = [
                g.datum || '',
                formatGermanDate(g.datum),
                g.spielklasse || '',
                g.heimName || '',
                g.gastName || ''
            ].join(' ').toLowerCase();
            const matchesSearch = !searchTerm || haystack.includes(searchTerm);
            return matchesKlasse && matchesSearch;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Keine passenden Spiele gefunden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        filtered.forEach(game => {
            const tr = document.createElement('tr');

            const cells = [
                formatGermanDate(game.datum),
                game.uhrzeit || '–',
                null,
                game.heimName || '–',
                game.gastName || '–',
                game.saetze || '0 : 0',
                game.punkte || '0 : 0',
                game.baelle || '0 : 0'
            ];

            cells.forEach((val, idx) => {
                const td = document.createElement('td');
                if (idx === 2) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = game.spielklasse || '–';
                    td.appendChild(badge);
                } else {
                    td.textContent = val;
                }
                if (idx === 5 || idx === 6 || idx === 7) {
                    td.style.fontWeight = '600';
                }
                tr.appendChild(td);
            });

            const actionTd = document.createElement('td');
            if (game.pdfData) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-sm';
                btn.textContent = '📄 PDF';
                btn.addEventListener('click', () => openPdfPreview(game));
                actionTd.appendChild(btn);
            } else {
                actionTd.textContent = '–';
            }
            tr.appendChild(actionTd);

            tbody.appendChild(tr);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btnRefresh').addEventListener('click', loadGamesFromGitHub);
        document.getElementById('searchInput').addEventListener('input', renderGames);
        document.getElementById('klasseFilter').addEventListener('change', renderGames);
        document.getElementById('sortOrderSelect').addEventListener('change', renderGames);

        loadGamesFromGitHub();
    });
</script>
</body>
</html>
